*,*::before,*::after{box-sizing:border-box}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:20}

.wrap{max-width:1100px;margin:0 auto;padding:0 20px 240px}

label.f{display:block;font-size:14px;color:var(--ink-soft);margin-bottom:5px}

nav.tabs .in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:64px}
nav.tabs button{background:none;border:0;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink-soft);position:relative}

nav.tabs button[aria-current=page]{color:var(--ink);font-weight:600}

.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;background:linear-gradient(transparent 62%,var(--marker) 62% 92%,transparent 92%);padding:0 6px}
.muted{color:var(--ink-soft);font-size:14px}
table.v{width:100%;border-collapse:collapse;font-size:15px}
table.v th{font-weight:600;text-align:left;font-size:13px;color:var(--ink-soft);padding:6px 8px;border-bottom:1.5px solid var(--line)}
table.v td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}

.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.mid{background:#fbefa6;color:#4a3b00} .pill.bad{background:var(--bad-bg);color:var(--bad)}

<script>
/* ---- Verschlüsselung (WebCrypto): PBKDF2-SHA256 + AES-256-GCM ---- */
window.VTC = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder(), ITER = 250000;
  const ok = () => !!(window.crypto && crypto.subtle && crypto.getRandomValues);
  const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  async function key(pw, salt, iter) {
    const base = await crypto.subtle.importKey("raw", enc.encode(String(pw)), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter || ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  }
  async function seal(k, text) { const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv: b64(iv), data: b64(new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, enc.encode(text)))) }; }
  async function open(k, o) { return dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.iv) }, k, unb64(o.data))); }

async function importDialog(lang) {
  await modal("Liste einfügen", (box, close) => {
    const tc = tagControls(S.lastTag);
    const ta = h("textarea", { placeholder: "Je Zeile eine Vokabel: Fremdsprache, Tab (oder Semikolon), Deutsch, optional Hinweis.\nTipp: In Excel zwei oder drei Spalten markieren, kopieren und hier einfügen." });
    const go = async () => {
      const lines = ta.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const arr = wordsOf(lang); let added = 0, skipped = 0; const tags = tc.get();
      for (const l of lines) {
        const p = (l.includes("\t") ? l.split("\t") : l.split(";")).map(s => s.trim());
        if (p.length < 2 || !p[0] || !p[1]) { skipped++; continue; }
        if (arr.length >= MAXV) { skipped++; continue; }
        arr.push({ f: p[0], d: p[1], h: p[2] || "", c: {}, t: tags }); added++;
      }
      if (!added) { toast("Keine gültigen Zeilen gefunden."); return; }
      S.lastTag = tags;
      try { await saveWords(lang, arr); close(true); toast(added + " Vokabeln hinzugefügt" + (skipped ? ", " + skipped + " Zeilen übersprungen" : "") + "."); renderAll(); } catch (e) { toastErr(e); }
    };
    box.append(h("div", null, h("label", { class: "f" }, "Tags für alle eingefügten Vokabeln (optional)"), tc.el), ta,
      h("div", { class: "row" }, h("button", { class: "btn", onclick: go }, "Übernehmen"), h("button", { class: "btn sec", onclick: () => close(false) }, "Abbrechen")));
  });
}

    h("p", { style: "margin:0;font-style:italic;line-height:1.5" }, "Weit hinter dem Horizont, wo das Meer die Worte der ganzen Welt an Land spült, ragt die große Bibliothek von Alexandria auf. Man erzählt, ihre Hallen bewahren jedes Wort, das je gesprochen wurde, geschrieben auf Rollen aus Sonnenlicht, in Tinte aus Sternenstaub."),
    h("p", { style: "margin:0;font-style:italic;line-height:1.5" }, "Doch ihre Tore öffnen sich nur denen, die die Sprachen der Welt kennen. Deine Reise beginnt an der Küste deiner ersten Sprache. Jede Aufgabe ist eine Insel, jedes gelöste Rätsel ein Stück der alten Karte. Sammle die Schlüssel, bezwinge die Stürme des Vergessens und finde den Weg in die verborgenen Hallen."),
    h("p", { style: "margin:0;font-style:italic;line-height:1.5" }, "Für jede Sprache, die du lernst, wartet ein eigener Pfad. Die Segel werden gerade gesetzt. Bald legt dein Schiff ab."),
    ls.length ? h("div", { class: "stack" }, h("b", null, "Deine Pfade"), h("div", { class: "row" }, ls.map(n => h("span", { class: "pill n" }, n)))) : null,
    h("p", { class: "muted", style: "margin:0;font-size:13px" }, "Die Aufgaben der Odyssee werden nach und nach hinzugefügt.")));
}

let vDrag = null;
window.addEventListener("pointerup", () => { vDrag = null; }); window.addEventListener("pointercancel", () => { vDrag = null; });

function ttsSelect(l) {
  const e = h("select", { "aria-label": "Aussprache " + l.name, disabled: !S.canWrite }, h("option", { value: "" }, "Keine Sprachausgabe"), ...TTS_CODES.map(([c, n]) => h("option", { value: c }, n)));
  e.value = typeof l.tts === "string" ? l.tts : guessTts(l.name);
  e.addEventListener("change", async () => { try { await wupdate("app/settings", { langs: S.settings.langs.map(x => x.id === l.id ? { ...x, tts: e.value } : x) }); toast("Aussprache gespeichert."); } catch (er) { toastErr(er); } });
  return e;
}

async function exportBackup() {
  if (!S.dl) { toast("Speichern von Dateien ist hier nicht verfügbar."); return; }
  const data = { app: "vokabeltrainer", version: 2, exported: new Date().toISOString(), kids: kidsOf(), langNames: Object.fromEntries(S.settings.langs.map(l => [l.id, l.name])), chap: S.chap,
    languages: S.settings.langs.map(l => ({ name: l.name, words: (S.vocab[l.id] || []).map(x => ({ f: x.f, d: x.d, h: x.h || "", c: normC(x.c), t: tg(x) })) })),
    log: S.log, asg: Object.values(S.asgs), pts: S.pts };
  try { await S.dl.save({ filename: "Vokabeltrainer_Sicherung_" + new Date().toISOString().slice(0, 10) + ".json", data: JSON.stringify(data, null, 1) }); toast("Sicherung gespeichert."); }
  catch (e) { if (!e || e.code !== "declined") toast("Sicherung fehlgeschlagen."); }
}
async function importBackup() {
  const inp = h("input", { type: "file", accept: ".json,application/json" });
  inp.addEventListener("change", async () => {
    const file = inp.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (data.app !== "vokabeltrainer" || !Array.isArray(data.languages)) throw new Error("Das ist keine Sicherung dieser App.");
      const kids = Array.isArray(data.kids) && data.kids.length ? data.kids.map(k => ({ id: String(k.id), name: String(k.name), active: k.active !== false, ...(okPhoto(k.photo) ? { photo: k.photo } : {}), ...(k.prof ? { prof: k.prof } : {}), ...(k.pin && typeof k.pin === "object" ? { pin: { s: String(k.pin.s || "").slice(0, 40), h: String(k.pin.h || "").slice(0, 80) } } : {}) })) : [{ id: "k1", name: "Person 1" }];
      const total = data.languages.reduce((s, l) => s + l.words.length, 0);
      if (!(await confirmBox("Sicherung einspielen?", "Alle aktuellen Sprachen, Personen, Aufgaben und Vokabeln (" + Object.values(S.vocab).reduce((s, a) => s + a.length, 0) + ") werden durch die Sicherung (" + data.languages.length + " Sprachen, " + kids.length + " Personen, " + total + " Vokabeln) ersetzt.", "Einspielen", true))) return;
      for (const k of kidsOf()) { await wdelete("exam/" + k.id); delete S.exams[k.id]; await wdelete("task/" + k.id); delete S.tasks[k.id]; }
      for (const a of Object.values(S.asgs)) await wdelete("asg/" + a.id); S.asgs = {};
      for (const id of Object.keys(S.pts)) await wdelete("pts/" + id); S.pts = {};
      for (const id of Object.keys(S.chap)) await wdelete("chap/" + id); S.chap = {};
      for (const l of S.settings.langs) await saveWords(l.id, []);
      const langs = [];
      for (const l of data.languages) {
        const id = uid(); langs.push({ id, name: String(l.name) });
        await saveWords(id, l.words.slice(0, MAXV).map(x => ({ f: String(x.f), d: String(x.d), h: String(x.h || ""),
          c: (x.c && typeof x.c === "object") ? x.c : (x.a ? { [kids[0].id]: [+x.a || 0, +x.r || 0, +x.w || 0] } : {}),
          t: Array.isArray(x.t) ? x.t.map(String) : ["", "", ""] })));
      }
      { const nm = data.langNames && typeof data.langNames === "object" ? data.langNames : {}, byNm = new Map(langs.map(l => [l.name, l.id]));
        kids.forEach(k => { if (!k.prof) return; const p = cleanProf({ ...k.prof, langs: (Array.isArray(k.prof.langs) ? k.prof.langs : []).map(l => ({ ...l, id: byNm.get(nm[l.id]) || l.id })) }); if (p) k.prof = p; else delete k.prof; }); }
      await wupdate("app/settings", { langs, kids, cfg: { lang: langs[0] ? langs[0].id : "", dir: "f2d", from: 1, to: 50 } });
      { const kidSet = new Set(kids.map(k => k.id)), byName = new Map(langs.map(l => [l.name, l.id]));
        for (const raw of (Array.isArray(data.asg) ? data.asg : []).slice(0, 300)) {
          const a = cleanAsg(raw); if (!a || !kidSet.has(a.kid)) continue;
          a.reqs.forEach(r => { r.lang = byName.get(r.langName) || r.lang; });
          await wset("asg/" + a.id, a); S.asgs[a.id] = a;
        }
        if (data.pts && typeof data.pts === "object") for (const id of Object.keys(data.pts)) if (kidSet.has(id)) { const p = normPts(data.pts[id], id); await wset("pts/" + id, p); S.pts[id] = p; }
        if (data.chap && typeof data.chap === "object") for (const id of Object.keys(data.chap)) if (kidSet.has(id)) { const c = remapChapLang(normChap(data.chap[id], id), o => byName.get((data.langNames || {})[o]) || o); await wset("chap/" + id, c); S.chap[id] = c; } }
      toast("Sicherung eingespielt.");
    } catch (e) { toast("Einspielen fehlgeschlagen: " + (e.message || e)); }
  });
  inp.click();
}

/* ------------------------------------------------------------------ Start */
async function migrateLegacy() {
  S.migrating = true;
  try {
    const old = await S.db.doc("app/task").get();
    if (old.exists) await wset("task/k1", { ...clone(old.data()), kid: "k1", kidName: "Person 1" });
    await wupdate("app/settings", { kids: [{ id: "k1", name: "Person 1" }], cfgs: { k1: cfgOf("k1") } });
    if (old.exists) await wdelete("app/task");
  } catch (e) { S.migrating = false; toastErr(e, "Umstellung auf Personen fehlgeschlagen."); }
}
function wire(db) {
  const bad = e => { S.sync = "err"; renderAll(); };
  db.doc("app/settings").onSnapshot(snap => {
    S.settings = snap.exists ? clone(snap.data()) : null; S.settingsLoaded = true; S.sync = "ok";
    if (S.settings) { pickKid(); if (!S.settings.kids && S.canWrite && !S.migrating) migrateLegacy(); }
    softRender();
  }, bad);
  db.collection("task").onSnapshot(qs => {
    qs.docs.forEach(d => {
      const kid = d.id, nt = clone(d.data()), cur = S.tasks[kid];
      const ae = document.activeElement;
      const typing = kid === S.kid && ae && ae.dataset && String(ae.dataset.key || "")[0] === "a";
      const same = cur && nt.created === cur.created;
      const localAnswers = same && cur.state === "OFFEN" && cur.items.some(i => norm(i.a) || i.tip);
      const staleOpen = same && cur.state === "ABGEGEBEN" && nt.state === "OFFEN";
      if (same && (staleOpen || (nt.state === "OFFEN" && cur.state === "OFFEN" && (typing || localAnswers)))) return;
      S.tasks[kid] = nt;
    });
    qs.docChanges().forEach(c => { if (c.type === "removed") delete S.tasks[c.doc.id]; });
    S.taskLoaded = true; softRender();
  }, bad);
  db.collection("exam").onSnapshot(qs => {
    qs.docs.forEach(d => {
      const kid = d.id, nt = clone(d.data()), cur = S.exams[kid];
      const ae = document.activeElement;
      const typing = kid === S.kid && ae && ae.dataset && String(ae.dataset.key || "")[0] === "a";
      const same = cur && nt.created === cur.created;
      const localAnswers = same && cur.state === "OFFEN" && cur.items.some(i => norm(i.a));
      const staleOpen = same && cur.state === "ABGEGEBEN" && nt.state === "OFFEN";
      const behind = same && cur.state === "OFFEN" && nt.state === "OFFEN" && (+nt.pos || 0) < (+cur.pos || 0);
      if (same && (staleOpen || behind || (nt.state === "OFFEN" && cur.state === "OFFEN" && (typing || localAnswers)))) return;
      S.exams[kid] = nt;
    });
    qs.docChanges().forEach(c => { if (c.type === "removed") delete S.exams[c.doc.id]; });
    S.examLoaded = true; softRender();
  }, bad);
  db.collection("exam_log").orderBy("ts", "desc").limit(300).onSnapshot(qs => { S.examLog = qs.docs.map(d => d.data()); softRender(); }, bad);
  db.collection("asg").onSnapshot(qs => { const m = {}; qs.docs.forEach(d => { const a = clone(d.data()); if (a && a.id && Array.isArray(a.reqs)) m[a.id] = a; }); S.asgs = m; softRender(); }, bad);
  db.collection("pts").onSnapshot(qs => { const m = {}; qs.docs.forEach(d => { m[d.id] = clone(d.data()); }); S.pts = m; softRender(); }, bad);
  db.collection("chap").onSnapshot(qs => { const m = {}; qs.docs.forEach(d => { m[d.id] = clone(d.data()); }); S.chap = m; softRender(); }, bad);
  db.collection("vocab").onSnapshot(qs => {
    const blocks = {}, vocab = {};
    qs.docs.forEach(d => { blocks[d.id] = d.data(); });
    Object.values(blocks).sort((a, b) => a.lang === b.lang ? a.b - b.b : (a.lang < b.lang ? -1 : 1)).forEach(bk => {
      (vocab[bk.lang] = vocab[bk.lang] || []).push(...bk.w.map(x => ({ f: x[0], d: x[1], h: x[2], c: typeof x[3] === "number" ? { _: [x[3], x[4], x[5]] } : (x[3] || {}), t: Array.isArray(x[4]) ? x[4] : ["", "", ""], m: typeof x[3] === "number" ? null : (x[5] || null) })));
    });
    S.blockDocs = blocks; S.vocab = vocab; S.vocabLoaded = true; softRender();
  }, bad);
  db.collection("log").orderBy("ts", "desc").limit(200).onSnapshot(qs => { S.log = qs.docs.map(d => d.data()); softRender(); }, bad);
}
async function boot() {
  renderAll();
  try {
    const [db, user, dl, sample] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("downloads"), window.claude.use("sample").catch(() => null)]);
    S.dl = dl; S.sample = sample || null; S.booted = true;
    if (!db) { S.db = null; S.sync = "err"; renderAll(); return; }
    S.db = db;
    if (user) { try { S.canWrite = (await user.can("data.write")) !== false; } catch (e) {} }
    wire(db);
    if (S.sample) { try { S.sampleLimits = await S.sample.limits(); } catch (e) { S.sampleLimits = null; } renderAll(); }
  } catch (e) { S.booted = true; S.db = null; S.sync = "err"; renderAll(); }
}
setInterval(() => { if (S.parentUntil && !parentOn()) { S.parentUntil = 0; renderAll(); } }, 15000);
if (window.claude && window.claude.use) boot(); else { renderAll(); }
