<style>

}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}

body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);min-height:100vh}

table.v{width:100%;border-collapse:collapse;font-size:15px}
table.v th{font-weight:600;text-align:left;font-size:13px;color:var(--ink-soft);padding:6px 8px;border-bottom:1.5px solid var(--line)}

.av.ph{background-size:cover;background-position:center;background-repeat:no-repeat}

.pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}

.card.lang{cursor:pointer}

.pill.n{background:var(--line);color:var(--ink)}
.cd{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.cd i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .2s linear}.cd.low i{background:var(--bad)}
.pill.gift{background:#fff1b8;color:#5a4400;white-space:normal}
@media (max-width:480px){nav.tabs button{font-size:12.5px}}
table.v.sm tbody tr{cursor:pointer}
table.v tr.selrow td{background:color-mix(in srgb,var(--marker) 24%,transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---- Verschlüsselung (WebCrypto): PBKDF2-SHA256 + AES-256-GCM ---- */
window.VTC = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder(), ITER = 250000;
  const ok = () => !!(window.crypto && crypto.subtle && crypto.getRandomValues);
  const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  async function key(pw, salt, iter) {
    const base = await crypto.subtle.importKey("raw", enc.encode(String(pw)), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter || ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  }
  async function seal(k, text) { const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv: b64(iv), data: b64(new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, enc.encode(text)))) }; }
  async function open(k, o) { return dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.iv) }, k, unb64(o.data))); }
  return {
    ok, ITER, b64, unb64, key, seal, open,
    async encryptWithPassword(text, pw) { const salt = crypto.getRandomValues(new Uint8Array(16)), k = await key(pw, salt, ITER); return { salt: b64(salt), iter: ITER, ...(await seal(k, text)) }; },
    async decryptWithPassword(o, pw) { return open(await key(pw, unb64(o.salt), Math.min(Number(o.iter) || ITER, 1000000)), o); },
    async exportKey(k) { return b64(new Uint8Array(await crypto.subtle.exportKey("raw", k))); },
    importKey(t) { return crypto.subtle.importKey("raw", unb64(t), "AES-GCM", true, ["encrypt", "decrypt"]); }
  };
})();

/* Lern-Version: lokale Datenbank, auf diesem Gerät verschlüsselt gespeichert und per Passwort gesperrt */
window.VT_LOCAL = true;

  function showLock(env) {

g = der vollständige deutsche Text dieser Vokabel genau wie gedruckt, zerlegt in Teile. Beginne einen neuen Teil an jeder Stelle, an der die Schrift zwischen FETT (b:true) und NORMAL (b:false) wechselt, auch mitten in einem Wort wie "(ver)brennen". Leerzeichen und Satzzeichen bleiben in t erhalten, ein Komma oder Semikolon bekommt die Schrift des Wortes direkt davor. Alle t zusammen ergeben genau den gedruckten deutschen Text. Kursiver deutscher Text zählt als normal (b:false).

Fett erkennst du daran, dass die Buchstaben deutlich dicker und dunkler sind als die normalen. Vergleiche innerhalb der Seite: Wörter, die genauso dick sind wie die klar fetten Einträge, sind fett. Dünnere Wörter in derselben Zeile sind normal, auch wenn sie direkt neben fetten stehen. Prüfe das für jedes Wort einzeln, nicht für die ganze Zeile.

u = true, wenn du dir bei dieser Vokabel beim Lesen oder bei fett/normal nicht sicher bist (verschwommen, Schatten, ähnliche Dicke). Sonst false.

Beispiele nur für das Format (fett ist hier mit ** markiert; übernimm niemals Inhalte aus den Beispielen):
- gedruckt "(ver)**brennen;** entbrannt sein" ergibt "g":[{"t":"(ver)","b":false},{"t":"brennen;","b":true},{"t":" entbrannt sein","b":false}]
- gedruckt "**die Ruhe,** die Stille; das Schweigen" ergibt "g":[{"t":"die Ruhe,","b":true},{"t":" die Stille; das Schweigen","b":false}]
- gedruckt "**auch; sogar**" ergibt "g":[{"t":"auch; sogar","b":true}]
- gedruckt "**warten (auf),** erwarten" ergibt "g":[{"t":"warten (auf),","b":true},{"t":" erwarten","b":false}]

Allgemein:
- Seitenzahlen, Überschriften, Nummerierungen und Übungsaufgaben lässt du weg.
- Erfinde nichts. Unleserliches lässt du weg oder markierst es mit u:true.
- Reihenfolge wie auf der Seite, eine Buchzeile = eine Vokabel.

function splitDH(toks) {

function fileToDataUrl(file, max = 1800) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("read"));
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        try { res(c.toDataURL("image/jpeg", 0.85)); } catch (e) { res(fr.result); }
      };
      img.onerror = () => res(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const KEY_STD = [[92, 1], [81, 2], [67, 3], [50, 4], [30, 5]];                            /* ab Prozent -> Note, darunter 6 */

const NOTENNAME = ["", "sehr gut", "gut", "befriedigend", "ausreichend", "mangelhaft", "ungenügend"];
function gradeFor(ok, n, klasse) {

  if (op) {
    let p = 0; for (let i = 0; i < KEY_OP.length; i++) if (pct + E >= KEY_OP[i]) { p = 15 - i; break; }

  }

/* Punktekonto je Person: Liste einzelner Ereignisse [id, Zeit, Kategorie 1-3, Punkte, Text]; old = Summe älterer, zusammengefasster Ereignisse je Kategorie */
function normPts(p, kid) {

}

  p.ev.forEach(e => { by[e[2]] += e[3]; });

}

    await wupdate("app/settings", { kids: [{ id: "k1", name: "Person 1" }], cfgs: { k1: cfgOf("k1") } });
    if (old.exists) await wdelete("app/task");
  } catch (e) { S.migrating = false; toastErr(e, "Umstellung auf Personen fehlgeschlagen."); }
}
function wire(db) {
  const bad = e => { S.sync = "err"; renderAll(); };
  db.doc("app/settings").onSnapshot(snap => {
    S.settings = snap.exists ? clone(snap.data()) : null; S.settingsLoaded = true; S.sync = "ok";
    if (S.settings) { pickKid(); if (!S.settings.kids && S.canWrite && !S.migrating) migrateLegacy(); }
    softRender();
  }, bad);
  db.collection("task").onSnapshot(qs => {
    qs.docs.forEach(d => {
      const kid = d.id, nt = clone(d.data()), cur = S.tasks[kid];
      const ae = document.activeElement;
      const typing = kid === S.kid && ae && ae.dataset && String(ae.dataset.key || "")[0] === "a";
      const same = cur && nt.created === cur.created;
      const localAnswers = same && cur.state === "OFFEN" && cur.items.some(i => norm(i.a) || i.tip);
      const staleOpen = same && cur.state === "ABGEGEBEN" && nt.state === "OFFEN";
      if (same && (staleOpen || (nt.state === "OFFEN" && cur.state === "OFFEN" && (typing || localAnswers)))) return;
      S.tasks[kid] = nt;
    });
    qs.docChanges().forEach(c => { if (c.type === "removed") delete S.tasks[c.doc.id]; });
    S.taskLoaded = true; softRender();
  }, bad);
  db.collection("exam").onSnapshot(qs => {
    qs.docs.forEach(d => {
      const kid = d.id, nt = clone(d.data()), cur = S.exams[kid];
      const ae = document.activeElement;
      const typing = kid === S.kid && ae && ae.dataset && String(ae.dataset.key || "")[0] === "a";
      const same = cur && nt.created === cur.created;
      const localAnswers = same && cur.state === "OFFEN" && cur.items.some(i => norm(i.a));
      const staleOpen = same && cur.state === "ABGEGEBEN" && nt.state === "OFFEN";
      const behind = same && cur.state === "OFFEN" && nt.state === "OFFEN" && (+nt.pos || 0) < (+cur.pos || 0);
      if (same && (staleOpen || behind || (nt.state === "OFFEN" && cur.state === "OFFEN" && (typing || localAnswers)))) return;
      S.exams[kid] = nt;
    });
    qs.docChanges().forEach(c => { if (c.type === "removed") delete S.exams[c.doc.id]; });
    S.examLoaded = true; softRender();
  }, bad);
  db.collection("exam_log").orderBy("ts", "desc").limit(300).onSnapshot(qs => { S.examLog = qs.docs.map(d => d.data()); softRender(); }, bad);
  db.collection("asg").onSnapshot(qs => { const m = {}; qs.docs.forEach(d => { const a = clone(d.data()); if (a && a.id && Array.isArray(a.reqs)) m[a.id] = a; }); S.asgs = m; softRender(); }, bad);
  db.collection("pts").onSnapshot(qs => { const m = {}; qs.docs.forEach(d => { m[d.id] = clone(d.data()); }); S.pts = m; softRender(); }, bad);
  db.collection("vocab").onSnapshot(qs => {
    const blocks = {}, vocab = {};
    qs.docs.forEach(d => { blocks[d.id] = d.data(); });
    Object.values(blocks).sort((a, b) => a.lang === b.lang ? a.b - b.b : (a.lang < b.lang ? -1 : 1)).forEach(bk => {
      (vocab[bk.lang] = vocab[bk.lang] || []).push(...bk.w.map(x => ({ f: x[0], d: x[1], h: x[2], c: typeof x[3] === "number" ? { _: [x[3], x[4], x[5]] } : (x[3] || {}), t: Array.isArray(x[4]) ? x[4] : ["", "", ""], m: typeof x[3] === "number" ? null : (x[5] || null) })));
    });
    S.blockDocs = blocks; S.vocab = vocab; S.vocabLoaded = true; softRender();
  }, bad);
  db.collection("log").orderBy("ts", "desc").limit(200).onSnapshot(qs => { S.log = qs.docs.map(d => d.data()); softRender(); }, bad);
}
async function boot() {
  renderAll();
  try {
    const [db, user, dl, sample] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("downloads"), window.claude.use("sample").catch(() => null)]);
    S.dl = dl; S.sample = sample || null; S.booted = true;
    if (!db) { S.db = null; S.sync = "err"; renderAll(); return; }
    S.db = db;
    if (user) { try { S.canWrite = (await user.can("data.write")) !== false; } catch (e) {} }
    wire(db);
    if (S.sample) { try { S.sampleLimits = await S.sample.limits(); } catch (e) { S.sampleLimits = null; } renderAll(); }
  } catch (e) { S.booted = true; S.db = null; S.sync = "err"; renderAll(); }
}
setInterval(() => { if (S.parentUntil && !parentOn()) { S.parentUntil = 0; renderAll(); } }, 15000);
if (window.claude && window.claude.use) boot(); else { renderAll(); }
</script>
